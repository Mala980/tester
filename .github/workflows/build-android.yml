name: Build browsers for Android/Termux (aarch64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: false
        default: 'android-aarch64'

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  ANDROID_NDK_HOME: "/opt/android-ndk"
  ZIG_HOME: "/opt/zig"
  WORK_DIR: "/tmp/android-build"
  JOBS: "4"
  LIGHTPANDA_V8_VERSION: "14.9.207.35"
  ZIG_V8_TAG: "v0.5.3"
  ZIG_V8_FORK_COMMIT: "57747955a59f09147b4dc1142152f0d960b2c7e1"
  OBSCURA_V8_CRATE_VERSION: "137.3.0"

jobs:
  # Native ARM64 job: produce the architecture-correct V8 snapshots.
  snapshots:
    name: ARM64 snapshots
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git curl wget unzip xz-utils rsync python3

      - name: Install Zig (arm64)
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          sudo mkdir -p /opt
          sudo mv "/tmp/zig-aarch64-linux-${ZIG_VERSION}" /opt/zig

      - name: Generate snapshots
        run: |
          export WORK_DIR="${WORK_DIR}"
          ./scripts/snapshot-arm64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            /tmp/android-build-arm/dist/*.bin
          if-no-files-found: error

  # Main x86_64 job: cross-compile both browsers for aarch64-linux-android.
  build:
    name: Build aarch64-linux-android
    needs: snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Zig, NDK, rust target)
        run: |
          ./scripts/setup-toolchain.sh

      - uses: actions/download-artifact@v4
        with:
          name: snapshots
          path: /tmp/android-build/snapshots

      - name: Prepare snapshot files
        run: |
          mkdir -p "${WORK_DIR}/cache"
          SNAP_DIR=/tmp/android-build/snapshots
          cp "$SNAP_DIR/obscura-snapshot.bin" "${WORK_DIR}/cache/obscura-snapshot.bin"
          if [ -f "$SNAP_DIR/lightpanda-snapshot.bin" ]; then
            cp "$SNAP_DIR/lightpanda-snapshot.bin" "${WORK_DIR}/cache/lightpanda-snapshot.bin"
          fi
          ls -lh "${WORK_DIR}/cache/"

      - name: Compute cache keys
        id: keys
        run: |
          LP_PATCH=$(sha256sum patches/lightpanda/build.zig-android.patch | cut -c1-12)
          V8_PATCH=$(sha256sum patches/zig-v8-fork/android.patch | cut -c1-12)
          OB_PATCH=$(sha256sum patches/obscura/build-rs-snapshot.patch | cut -c1-12)
          echo "v8=$V8_PATCH-$LP_PATCH" >> "$GITHUB_OUTPUT"
          echo "obscura=$OB_PATCH" >> "$GITHUB_OUTPUT"

      - name: Cache lightpanda V8 archive
        uses: actions/cache@v4
        id: cache-lp-v8
        with:
          path: /tmp/android-build/cache/libc_v8_14.9.207.35_android_aarch64.a
          key: lp-v8-${{ env.LIGHTPANDA_V8_VERSION }}-${{ steps.keys.outputs.v8 }}-${{ env.ZIG_VERSION }}

      - name: Cache obscura v8 lib
        uses: actions/cache@v4
        id: cache-ob-v8
        with:
          path: /tmp/android-build/cache/librusty_v8_release_aarch64-linux-android.a
          key: ob-v8-${{ env.OBSCURA_V8_CRATE_VERSION }}-${{ steps.keys.outputs.obscura }}

      - name: Build Lightpanda (V8 + zig)
        run: |
          source scripts/env.sh
          export OBSCURA_SNAPSHOT_FILE="${WORK_DIR}/cache/obscura-snapshot.bin"
          ./scripts/build-lightpanda-android.sh 2>&1 | tee "${WORK_DIR}/lightpanda-build.log"

      - name: Build Obscura (render, no-render, stealth)
        run: |
          source scripts/env.sh
          export OBSCURA_SNAPSHOT_FILE="${WORK_DIR}/cache/obscura-snapshot.bin"
          ./scripts/build-obscura-android.sh 2>&1 | tee "${WORK_DIR}/obscura-build.log"

      - name: Package
        run: |
          source scripts/env.sh
          ./scripts/package.sh

      - name: Verify binaries
        run: |
          PKG=/tmp/android-build/packages
          for t in "$PKG"/*.tar.xz; do
            echo "=== $t ==="
            tar -xJf "$t" -C /tmp/verify 2>/dev/null || { mkdir -p /tmp/verify && tar -xJf "$t" -C /tmp/verify; }
            for f in /tmp/verify/*; do
              [ -f "$f" ] || continue
              case "$f" in *.so|*.so.*) continue;; esac
              file "$f" | cut -c1-90
              readelf -h "$f" | grep -E 'Type|Machine'
              readelf -d "$f" | grep NEEDED
            done
            rm -rf /tmp/verify/* /tmp/verify/.??*
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'android-aarch64' }}
          name: Browsers for Android/Termux (aarch64) — ${{ inputs.tag || 'android-aarch64' }}
          files: |
            /tmp/android-build/packages/*.tar.xz
          body: |
            ## Obscura + Lightpanda — native Android/Termux (aarch64)

            Native **bionic-linked PIE** binaries — no glibc, no wrapper. Install on Termux:

            ```bash
            # Lightpanda
            curl -LO https://github.com/Mala980/tester/releases/latest/download/lightpanda-aarch64-android.tar.xz
            tar xf lightpanda-aarch64-android.tar.xz
            chmod +x lightpanda && ./lightpanda --version

            # Obscura (render)
            curl -LO https://github.com/Mala980/tester/releases/latest/download/obscura-aarch64-android.tar.xz
            tar xf obscura-aarch64-android.tar.xz
            chmod +x obscura obscura-worker
            ./obscura fetch https://example.com --eval "document.title"
            ```

            Notes:
            - Requires a modern device (kernel 5.10+; Zig 0.16 target baseline).
            - Obscura bundles `libc++_shared.so` — keep it next to the binary
              (or `pkg install libc++`).
            - Build system: `scripts/` + `patches/` in this repo; reference
              `Haris131/opencode-termux` for the NDK/API24/ELF-fix approach.
          draft: false
          prerelease: false

      - name: Keep artifacts on the runner (debug)
        if: always()
        run: |
          echo "Build logs:"
          ls -la /tmp/android-build/*.log 2>/dev/null || true
          du -sh /tmp/android-build 2>/dev/null || true