name: Build Android/Termux aarch64

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ZIG_VERSION: "0.16.0"
  JOBS: "4"

jobs:
  build-obscura:
    permissions:
      contents: write
    name: Build Obscura for Android aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl wget unzip xz-utils zip rsync \
            build-essential pkg-config \
            cmake clang llvm-dev libclang-dev \
            git python3 ninja-build \
            golang-go ruby perl \
            libglib2.0-dev \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user-static \
            patchelf

      - name: Install LLVM 23 for V8 host build
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          CLANG_DIR=/usr/lib/llvm-23/lib/clang/23
          sudo ln -nsf "$CLANG_DIR/lib/linux/libclang_rt.builtins-x86_64.a" "$CLANG_DIR/lib/linux/libclang_rt.builtins.a"
          sudo ln -nsf "$CLANG_DIR/lib/linux" "$CLANG_DIR/lib/x86_64-unknown-linux-gnu"

      - name: Install Android NDK r27d
        run: |
          NDK_DIR="/opt/android-ndk"
          if [ -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" ]; then
            echo "NDK already installed at $NDK_DIR"
          else
            echo "Downloading Android NDK r27d..."
            cd /tmp
            wget -q "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip" -O ndk.zip
            sudo mkdir -p /opt
            sudo unzip -q ndk.zip -d /opt/
            sudo mv /opt/android-ndk-r27d "$NDK_DIR"
            rm ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android aarch64-unknown-linux-gnu
          rustup component add llvm-tools-preview

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cache
          key: ${{ runner.os }}-obscura-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-obscura-cargo-

      - name: Build Obscura
        run: |
          source "$HOME/.cargo/env"
          chmod +x scripts/*.sh
          ./scripts/build-obscura-android.sh

      - name: Upload Obscura artifact
        uses: actions/upload-artifact@v7
        with:
          name: obscura-android-aarch64
          path: /tmp/android-build/dist/obscura-*

  build-lightpanda:
    permissions:
      contents: write
    name: Build Lightpanda for Android aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl wget unzip xz-utils zip rsync \
            build-essential pkg-config \
            cmake clang llvm-dev libclang-dev \
            git ca-certificates \
            pkg-config libglib2.0-dev make \
            python3 ninja-build \
            golang-go ruby perl \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user-static

      - name: Install LLVM 23 for V8 host build
        run: |
          # zig-v8-fork hardcodes clang_base_path="/usr/lib/llvm-23" for V8.
          # Install LLVM 23 from apt.llvm.org (same as zig-v8-fork CI).
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          CLANG_DIR=/usr/lib/llvm-23/lib/clang/23
          # V8 host build (x86_64) needs libclang_rt.builtins for x86_64
          sudo ln -nsf "$CLANG_DIR/lib/linux/libclang_rt.builtins-x86_64.a" "$CLANG_DIR/lib/linux/libclang_rt.builtins.a"
          sudo ln -nsf "$CLANG_DIR/lib/linux" "$CLANG_DIR/lib/x86_64-unknown-linux-gnu"
          # Also create aarch64 symlinks for target build
          sudo ln -nsf "$CLANG_DIR/lib/linux/libclang_rt.builtins-aarch64.a" "$CLANG_DIR/lib/linux/libclang_rt.builtins-aarch64-link.a" 2>/dev/null || true
          echo "LLVM 23 installed:" && ls "$CLANG_DIR/lib/linux/"

      - name: Install Android NDK r27d
        run: |
          NDK_DIR="/opt/android-ndk"
          if [ -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" ]; then
            echo "NDK already installed at $NDK_DIR"
          else
            echo "Downloading Android NDK r27d..."
            cd /tmp
            wget -q "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip" -O ndk.zip
            sudo mkdir -p /opt
            sudo unzip -q ndk.zip -d /opt/
            sudo mv /opt/android-ndk-r27d "$NDK_DIR"
            rm ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install Zig
        run: |
          echo "Installing Zig ${ZIG_VERSION}..."
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mkdir -p /opt
          sudo rm -rf /opt/zig
          sudo mv "zig-x86_64-linux-${ZIG_VERSION}" /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH
          export PATH="/opt/zig:$PATH"
          zig version

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android aarch64-unknown-linux-gnu

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cache
          key: ${{ runner.os }}-lightpanda-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-lightpanda-

      - name: Build Lightpanda
        run: |
          source "$HOME/.cargo/env"
          chmod +x scripts/*.sh
          ./scripts/build-lightpanda-android.sh

      - name: Upload Lightpanda artifact
        uses: actions/upload-artifact@v7
        with:
          name: lightpanda-android-aarch64
          path: /tmp/android-build/dist/lightpanda*

      - name: Upload Lightpanda build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lightpanda-build-log
          path: /tmp/android-build/build-lightpanda.log

  create-release:
    permissions:
      contents: write
    name: Create GitHub Release
    needs: [build-obscura, build-lightpanda]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | head -30
          ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Android/Termux aarch64 Build"
          tag_name: "android-aarch64-$(date +%Y%m%d-%H%M%S)"
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.xz
            artifacts/**/*
          body: |
            ## Android/Termux aarch64 Build
            
            This release contains Obscura and Lightpanda compiled for Android/Termux aarch64.
            
            ### Build Info
            - Android API level: ${{ env.ANDROID_API }}
            - NDK: r27d (${{ env.ANDROID_NDK_VERSION }})
            - Zig: ${{ env.ZIG_VERSION }}
            - Build date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          draft: false
          prerelease: false
